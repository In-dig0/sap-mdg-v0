# =============================================================================
# MDG - Migration Data Governance | docker-compose.override.yml
# Ambiente: SVILUPPO LOCALE (WSL2)
#
# Applicato automaticamente da Docker Compose insieme al file base.
# Uso: docker compose up -d
#
# Espone tutte le porte direttamente sull'host per comodità di sviluppo.
# NON usare in produzione.
# =============================================================================

services:

  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  pgadmin:
    ports:
      - "${PGADMIN_PORT}:80"

  sftp:
    ports:
      - "${SFTP_PORT}:2022"
      - "${SFTPGO_ADMIN_PORT}:8080"        # WebAdmin accessibile in locale

  streamlit:
    ports:
      - "${STREAMLIT_PORT}:8501"

  fastapi:
    ports:
      - "${FASTAPI_PORT:-8000}:8000"

  mdg_auth:
    ports:
      - "8001:8001"
