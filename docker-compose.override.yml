# =============================================================================
# MDG - Migration Data Governance | docker-compose.override.yml
# Ambiente: SVILUPPO LOCALE (WSL2)
#
# Applicato automaticamente da Docker Compose insieme al file base.
# Uso: docker compose up -d   /   docker compose down
#
# - Espone tutte le porte direttamente sull'host per comodità di sviluppo.
# - Disattiva il riavvio automatico: in locale i container partono solo
#   con un comando esplicito (non all'avvio di WSL).
# NON usare in produzione.
# =============================================================================

services:

  postgres:
    restart: "no"
    ports:
      - "${POSTGRES_PORT}:5432"

  pgadmin:
    restart: "no"
    ports:
      - "${PGADMIN_PORT}:80"

  sftp:
    restart: "no"
    ports:
      - "${SFTP_PORT}:2022"
      - "${SFTPGO_ADMIN_PORT}:8080"        # WebAdmin accessibile in locale

  streamlit:
    restart: "no"
    ports:
      - "${STREAMLIT_PORT}:8501"

  fastapi:
    restart: "no"
    ports:
      - "${FASTAPI_PORT:-8000}:8000"

  mdg_auth:
    restart: "no"
    ports:
      - "8001:8001"

  bruin:
    restart: "no"
