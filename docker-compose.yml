# =============================================================================
# MDG - Migration Data Governance | docker-compose.yml
# Versione: v1 (base — comune a tutti gli ambienti)
#
# NON usare direttamente: questo file va sempre affiancato da un override.
#
#   Sviluppo locale WSL2:
#     docker compose up -d
#     (applica automaticamente docker-compose.override.yml)
#
#   Produzione OCI:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Schemi PostgreSQL: raw · ref · stg · prd
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — database MDG
  # ---------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: mdg_postgres
    restart: unless-stopped
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
      TZ:                ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mdg_network

  # ---------------------------------------------------------------------------
  # PgAdmin — interfaccia web per PostgreSQL
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mdg_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:              ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD:           ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE:         "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      TZ:                                 ${TZ}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdg_network

  # ---------------------------------------------------------------------------
  # SFTP (SFTPGo) — punto di ingresso file ZIP e XLSX
  # ---------------------------------------------------------------------------
  sftp:
    image: drakkan/sftpgo:latest
    container_name: mdg_sftp
    restart: unless-stopped
    user: "0:0"
    volumes:
      - sftpgo_data:/var/lib/sftpgo
      - ${SFTP_KEY_PATH}/ssh_host_ed25519_key:/var/lib/sftpgo/.ssh/ssh_host_ed25519_key:ro
      - ${SFTP_KEY_PATH}/ssh_host_rsa_key:/var/lib/sftpgo/.ssh/ssh_host_rsa_key:ro
      - datalake_pprod:/datalake/in_source_pprod
      - datalake_sap:/datalake/in_source_sap
      - datalake_others:/datalake/in_source_others
      - datalake_out:/datalake/out_source_mdg
    environment:
      SFTPGO_HTTPD__BINDINGS__0__PORT:          8080
      SFTPGO_SFTPD__BINDINGS__0__PORT:          2022
      SFTPGO_DATA_PROVIDER__DRIVER:             sqlite
      SFTPGO_DATA_PROVIDER__NAME:               /var/lib/sftpgo/sftpgo.db
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_SFTPD__HOST_KEYS:                  /var/lib/sftpgo/.ssh/ssh_host_ed25519_key,/var/lib/sftpgo/.ssh/ssh_host_rsa_key
      SFTPGO_DEFAULT_ADMIN_USERNAME:            ${SFTPGO_ADMIN_USER}
      SFTPGO_DEFAULT_ADMIN_PASSWORD:            ${SFTPGO_ADMIN_PASSWORD}
      TZ:                                       ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdg_network

  # ---------------------------------------------------------------------------
  # Bruin — orchestratore pipeline (ingestion + quality checks)
  # Run manuale: docker exec -it mdg_bruin bruin run /project/bruin
  # ---------------------------------------------------------------------------
  bruin:
    build:
      context: ./bruin
      dockerfile: Dockerfile
    container_name: mdg_bruin
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    working_dir: /project/bruin
    environment:
      POSTGRES_HOST:     ${POSTGRES_HOST}
      POSTGRES_PORT:     ${POSTGRES_PORT}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ:                ${TZ}
    volumes:
      - .:/project
      - datalake_pprod:/project/datalake/in_source_pprod:ro
      - datalake_sap:/project/datalake/in_source_sap:ro
      - datalake_others:/project/datalake/in_source_others:ro
      - datalake_out:/project/datalake/out_source_mdg
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdg_network

  # ---------------------------------------------------------------------------
  # Streamlit — dashboard qualità dati MDG
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: mdg_streamlit
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB:   ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./streamlit/app:/app
      - ./bruin/config:/app/config
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdg_network

  # ---------------------------------------------------------------------------
  # FastAPI — Pipeline Controller
  # Docs: /docs (Swagger) · /redoc (ReDoc)
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mdg_fastapi
    restart: unless-stopped
    environment:
      BRUIN_CONTAINER:   mdg_bruin
      BRUIN_PIPELINE:    /project/bruin
      SEMAPHORE_PATH:    /data/inbound/DATASET_READY.txt
      SAP_PATH:          /data/in_source_sap
      OTHERS_PATH:       /data/in_source_others
      OUT_MDG_PATH:      /data/out_source_mdg
      LOG_DIR:           /logs
      POSTGRES_HOST:     ${POSTGRES_HOST}
      POSTGRES_PORT:     ${POSTGRES_PORT}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ:                ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - datalake_pprod:/data/inbound
      - datalake_sap:/data/in_source_sap
      - datalake_others:/data/in_source_others
      - datalake_out:/data/out_source_mdg
      - api_logs:/logs
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdg_network

  # ---------------------------------------------------------------------------
  # mdg_auth — FastAPI + JWT Authentication Controller
  # ---------------------------------------------------------------------------
  mdg_auth:
    build:
      context: ./auth/api
      dockerfile: Dockerfile
    container_name: mdg_auth
    restart: unless-stopped
    environment:
      POSTGRES_HOST:        postgres
      POSTGRES_PORT:        5432
      POSTGRES_DB:          ${POSTGRES_DB}
      POSTGRES_USER:        ${POSTGRES_USER}
      POSTGRES_PASSWORD:    ${POSTGRES_PASSWORD}
      JWT_SECRET:           ${JWT_SECRET}
      JWT_LIFETIME_SECONDS: 28800
      ADMIN_EMAIL:          ${ADMIN_EMAIL}
      ADMIN_PASSWORD:       ${ADMIN_PASSWORD}
      ADMIN_NAME:           ${ADMIN_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdg_network

# =============================================================================
# Volumi
# =============================================================================
volumes:
  postgres_data:
    name: mdg_postgres_data
  pgadmin_data:
    name: mdg_pgadmin_data
  sftpgo_data:
    name: mdg_sftpgo_data
  datalake_pprod:
    name: mdg_datalake_pprod
  datalake_sap:
    name: mdg_datalake_sap
  datalake_others:
    name: mdg_datalake_others
  datalake_out:
    name: mdg_datalake_out
  api_logs:
    name: mdg_api_logs

# =============================================================================
# Rete interna
# =============================================================================
networks:
  mdg_network:
    name: mdg_network
    driver: bridge
